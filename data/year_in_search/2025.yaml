# Google "Year in Search 2025" trending lists (verbatim), retrieved 2026-07-22.
#
# These are TRENDING queries -- the searches that grew fastest in 2025 vs 2024,
# not the highest-volume searches. This is the bottom-up corpus for the
# archetypal-classification experiment: instead of guessing symbol->archetype
# queries, we take what people actually surged toward and read the archetypes
# out of it afterward.
#
# Source: Google Year in Search 2025, as reported by Search Engine Land and
# Search Engine Journal (see results/YEAR_IN_SEARCH_FINDINGS.md for URLs).
# "Year in Search 2026" does not exist yet (we are mid-2026), so 2025 is the most
# recent complete annual list and the best available proxy for "the last year".

